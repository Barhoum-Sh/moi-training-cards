name: Deploy MOI PWA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare Site & PWA
        run: |
          mkdir -p _site
          if [ -f "index.html" ]; then cp "index.html" "_site/index.html"; fi
          if [ -f "inspector.html" ]; then cp "inspector.html" "_site/inspector.html"; fi
          for f in *.html; do
            if [ ! -e "$f" ] || [ "$f" = "index.html" ] || [ "$f" = "inspector.html" ]; then continue; fi
            if grep -qiE "BarcodeDetector|jsQR|الرقابة والتدقيق|رادار" "$f"; then
              cp "$f" "_site/inspector.html"
            else
              cp "$f" "_site/index.html"
            fi
          done
          if [ ! -f "_site/index.html" ] && [ -f "code_artifact.html" ]; then cp "code_artifact.html" "_site/index.html"; fi
          if [ ! -f "_site/inspector.html" ] && [ -f "code_artifact2.html" ]; then cp "code_artifact2.html" "_site/inspector.html"; fi
          for sw in sw.service.worker.js sw_service_worker.js sw.js; do
            if [ -f "$sw" ]; then
              cp "$sw" "_site/sw.service.worker.js"
              cp "$sw" "_site/sw_service_worker.js"
              cp "$sw" "_site/sw.js"
              break
            fi
          done

          # إنشاء أيقونة التطبيق الرسمية النقية للمنظومة
          cat << 'EOF' > _site/icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="#0f172a"/><polygon points="80,80 432,80 432,280 256,432 80,280" fill="#065f46" stroke="#d97706" stroke-width="16"/><text x="256" y="275" font-size="70" font-weight="bold" fill="#fbbf24" text-anchor="middle" font-family="sans-serif">MOI</text></svg>
          EOF

          # ملف التعريف الرسمي PWA المتوافق تماماً مع شروط التثبيت في Chrome
          cat << 'EOF' > _site/manifest.json
          {
            "name": "وزارة الداخلية — منظومة البطاقات التدريبية",
            "short_name": "الرقابة الميدانية",
            "start_url": "./index.html",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "dir": "rtl",
            "lang": "ar",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [
              {
                "src": "icon.svg",
                "sizes": "192x192 512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

          for page in _site/index.html _site/inspector.html; do
            if [ -f "$page" ] && ! grep -q 'rel="manifest"' "$page"; then
              sed -i 's|</head>|<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f172a"></head>|i' "$page"
            fi
          done

          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
